name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out adapter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run static checks, tests, build and secret pattern scan
        run: npm run check

      - name: Enforce coverage thresholds
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Reproduce fixtures
        run: npm run fixtures:generate

      - name: Confirm fixture reproducibility
        run: git diff --exit-code

      - name: Confirm protected tampering fails
        run: |
          if npm run verify:evidence -- fixtures/tamper/changed-amount.json; then
            echo "Tampered evidence unexpectedly verified"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check out pinned Inntris verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Inntris/inntris-verify
          ref: f3e85242f8170fe96ca89d53b0442bcb37a5d92c
          path: upstream/inntris-verify
          persist-credentials: false

      - name: Verify evidence pack with pinned upstream verifier
        run: |
          public_key="$(tr -d '\r\n' < fixtures/allow/public-key.txt)"
          python upstream/inntris-verify/verify_pack.py fixtures/allow/evidence-pack.zip --pubkey "$public_key"

      - name: Build runtime container
        run: docker build --tag inntris-highnote-adapter:ci .
